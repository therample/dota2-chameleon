<!DOCTYPE html>
<html lang="en">
<head>
<!-- шрифты с сайта-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chameleon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
:root{
  --bg:#070707;--bg2:#0a0a0a;--panel:#0d0d0d;--panel2:#111;--panel3:#161616;--panel4:#1a1a1a;
  --border:#1a1a1a;--border2:#222;--border3:#2c2c2c;--border4:#383838;
  --hover:#181818;--hover2:#1f1f1f;--text:#f5f5f5;--text2:#bbb;--muted:#4a4a4a;--muted2:#6a6a6a;
  --red:#ff4757;--green:#2ed573;--radius:14px;--ease:cubic-bezier(.22,1,.36,1);
  --r-common:#5a5a5a;--r-uncommon:#7a7a7a;--r-rare:#9a9a9a;--r-mythical:#b8b8b8;--r-legendary:#d4d4d4;--r-immortal:#ececec;--r-arcana:#fff;--r-ancient:#c8c8c8;--r-seasonal:#8a8a8a;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideInR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideInL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes ripple{0%{transform:scale(0);opacity:.45}100%{transform:scale(4);opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes check{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes drift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sweep{from{background-position:-80% 0}to{background-position:180% 0}}
@keyframes shake{0%,100%{transform:translate(-50%,0)}25%{transform:translate(calc(-50% - 6px),0)}75%{transform:translate(calc(-50% + 6px),0)}}
/* ---- loading screen ---- */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{from{fill-opacity:0}to{fill-opacity:.12}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes ringPulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.04)}}
@keyframes letterIn{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}50%{filter:drop-shadow(0 0 22px rgba(255,255,255,.7))}}
@keyframes burst{to{transform:scale(2.6);opacity:0}}
html,body{background:transparent}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:13px;overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased;color:var(--text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:15px;height:15px}
.app{width:100%;height:100%;background:var(--bg);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border3);position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.03)}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.titlebar{height:46px;background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:40;border-bottom:1px solid var(--border2);position:relative}
.drag{flex:1;display:flex;align-items:center;gap:10px;height:100%}
.tlogo{width:24px;height:24px;color:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.2))}
.title{font-size:15px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#fff,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ver{color:var(--muted2);font-size:10px;font-weight:700;letter-spacing:1px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--panel3);color:var(--muted2);transition:all .3s}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--muted2);transition:all .3s}
.pill.on{color:var(--green);background:rgba(46,213,115,.1)}.pill.on .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.wc{display:flex;gap:8px}
.wb{width:13px;height:13px;border-radius:50%;border:0;cursor:pointer;transition:transform .15s,filter .15s}
.wb:hover{transform:scale(1.2);filter:brightness(1.2)}
.wb.min{background:#ffbd2e}.wb.max{background:#28c940}.wb.cl{background:#ff5f56}

.body{flex:1;display:flex;min-height:0;position:relative;z-index:1}
.side{width:62px;background:var(--panel);border-right:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0;position:relative;z-index:30}
.logo{width:38px;height:38px;display:grid;place-items:center;margin-bottom:10px;color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.18))}
.logo svg{width:28px;height:28px}
.nav{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted2);cursor:pointer;position:relative;transition:all .25s var(--ease)}
.nav:hover{background:var(--hover);color:#ccc;transform:translateY(-1px)}
.nav svg{transition:transform .25s var(--ease)}.nav:hover svg{transform:scale(1.1)}
.nav.on{background:var(--panel3);color:#fff}
.nav.on svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.nav.on::before{content:"";position:absolute;left:-9px;top:50%;width:3px;height:22px;transform:translateY(-50%);background:linear-gradient(180deg,#fff,#888);border-radius:0 3px 3px 0;animation:pop .35s var(--ease)}
.nav .tip{position:absolute;left:56px;top:50%;transform:translate(-6px,-50%);background:#fff;color:#000;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none;opacity:0;transition:all .18s;z-index:100;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.nav .tip::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;background:#fff;transform:translateY(-50%) rotate(45deg)}
.nav:hover .tip{opacity:1;transform:translate(0,-50%)}
.sp{flex:1}
.badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:#fff;color:#000;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:pop .35s var(--ease)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
.content{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:12px 16px;display:none;scroll-behavior:auto}
.page.on{display:block;animation:fadeIn .3s var(--ease)}
.page.fwd.on{animation:slideInR .28s var(--ease)}.page.back.on{animation:slideInL .28s var(--ease)}
.page::-webkit-scrollbar{width:5px}.page::-webkit-scrollbar-thumb{background:var(--border3);border-radius:3px}
h1{font-size:17px;font-weight:800;letter-spacing:.2px}
.sub{color:var(--muted2);font-size:11.5px;margin:3px 0 12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.phead .pi{width:38px;height:38px;border-radius:11px;background:var(--panel3);border:1px solid var(--border3);display:grid;place-items:center;color:#fff;flex-shrink:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{position:relative;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--border2);border-radius:12px;padding:11px 14px;animation:cardIn .45s var(--ease) both;display:flex;align-items:center;gap:12px;overflow:hidden}
.stat .n{font-size:20px;font-weight:900;letter-spacing:.5px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted2);margin-top:3px}
.stat svg{color:var(--muted2)}

.search{background:var(--bg2);border:1px solid var(--border3);border-radius:10px;color:#fff;padding:8px 13px;font:inherit;font-size:12px;min-width:200px;transition:all .2s;-webkit-user-select:text;user-select:text}
.search:focus{outline:none;border-color:var(--border4);background:var(--panel);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
select{background:var(--bg2);border:1px solid var(--border3);border-radius:10px;color:#fff;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer;max-width:260px}
select:focus{outline:none;border-color:var(--border4)}
select.sm{padding:6px 10px;font-size:11px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel3);border:1px solid var(--border3);color:#fff;padding:8px 14px;border-radius:10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s var(--ease);position:relative;overflow:hidden}
.btn:hover{background:var(--hover2);border-color:var(--border4);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.pri{background:#fff;color:#000;border-color:#fff}.btn.pri:hover{background:#e8e8e8}
.btn.dng:hover{background:rgba(255,71,87,.12);border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;pointer-events:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);width:20px;height:20px;margin:-10px;pointer-events:none;animation:ripple .6s ease-out forwards}
.btn.pri .rip{background:rgba(0,0,0,.25)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--border3);color:var(--muted2);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.chip:hover{color:#ccc;border-color:var(--border4);transform:translateY(-1px)}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip .n{font-size:10px;opacity:.55}
.chip .ct{min-width:15px;height:15px;border-radius:8px;background:#fff;color:#000;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:pop .3s var(--ease)}
.chip.on .ct{background:#000;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--border2);border-radius:11px;padding:3px;gap:2px}
.seg .s{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted2);cursor:pointer;transition:all .22s var(--ease);display:flex;gap:6px;align-items:center}
.seg .s:hover{color:#ccc}.seg .s.on{background:#fff;color:#000}
.seg .s .n{font-size:10px;opacity:.55}
.seg.sm .s{padding:4px 10px;font-size:10px}
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
.gtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.gtab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--border2);color:var(--muted2);font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .22s var(--ease)}
.gtab:hover{color:#ddd;border-color:var(--border4);transform:translateY(-1px)}
.gtab.on{background:#fff;color:#000;border-color:#fff}

.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.hcard{position:relative;background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:6px 6px 8px;cursor:pointer;transition:all .25s var(--ease);animation:cardIn .35s var(--ease) both;animation-delay:calc(min(var(--i,0),16) * 18ms);content-visibility:auto;contain-intrinsic-size:88px 84px}
.hcard:hover{background:var(--hover);border-color:var(--border4);transform:translateY(-3px) scale(1.07);box-shadow:0 10px 24px rgba(0,0,0,.5);z-index:4}
.hcard:active{transform:scale(.97)}
.hcard .ph{aspect-ratio:16/9;border-radius:8px}
.hcard .nm{margin-top:6px;font-size:10.5px;font-weight:700;color:var(--text2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard:hover .nm{color:#fff}
.hcard .cnt{position:absolute;top:2px;right:2px;min-width:20px;height:20px;border-radius:10px;background:#fff;color:#000;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 8px rgba(0,0,0,.6);animation:pop .4s var(--ease);z-index:3}
.hcard.has{border-color:#666}

.ph{position:relative;background:var(--panel3);overflow:hidden;display:grid;place-items:center}
.ph .ini{position:absolute;color:var(--muted);font-weight:900;font-size:18px;letter-spacing:1px}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.ph.loaded::after{display:none}.ph.loaded .ini{display:none}
.ph img{position:relative;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.94);transition:opacity .35s,transform .45s var(--ease)}
.ph.loaded img{opacity:1;transform:none}

.dhead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.dhead .ph{width:84px;height:48px;border-radius:9px;flex-shrink:0}
.dhead h1{font-size:19px}
.dhead .meta{color:var(--muted2);font-size:11px;margin-top:2px;display:flex;align-items:center;gap:8px;min-height:18px}
.mods{display:inline-flex;align-items:center;background:#fff;color:#000;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:900;animation:pop .4s var(--ease)}

.slothead{display:flex;align-items:center;gap:10px;margin:16px 0 8px;color:var(--text2);font-weight:800;font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
.slothead::after{content:"";flex:1;height:1px;background:var(--border2)}
.slothead .ct{background:#fff;color:#000;border-radius:8px;padding:0 7px;font-size:10px;font-weight:900;order:2}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.igrid.d-s{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.igrid.d-l{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{position:relative;background:var(--panel);border:1px solid var(--border2);border-radius:13px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .22s var(--ease),border-color .2s,background .2s,box-shadow .22s;animation:cardIn .36s var(--ease) both;animation-delay:calc(min(var(--i,0),18) * 20ms);content-visibility:auto;contain-intrinsic-size:128px 170px}
.card.late{animation:none}
.card:hover{background:var(--hover);border-color:var(--border4);transform:translateY(-4px) scale(1.045);box-shadow:0 14px 30px rgba(0,0,0,.55);z-index:4}
.card:active{transform:scale(.97)}
.card .ph{aspect-ratio:4/3;background:var(--panel2)}
.card .ph img{padding:6px}
.card .bar{height:3px;background:var(--rc,var(--r-common));transition:height .2s}
.card:hover .bar{height:5px}
.card .info{padding:7px 9px 9px}
.card .t{font-size:12px;font-weight:700;line-height:1.3;max-height:2.6em;overflow:hidden;color:#fff}
.card .m{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.card .tag{position:absolute;top:7px;left:7px;font-size:9px;font-weight:900;letter-spacing:.6px;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.7);color:#fff;z-index:2}
.card .tag.arc{background:#fff;color:#000}
.card .tick{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--ease);z-index:2}
.card.sel{border-color:#fff;background:var(--panel3);box-shadow:0 0 0 1px #fff,0 8px 22px rgba(255,255,255,.07)}
.card.sel .tick{transform:scale(1)}
.card.sel .tick path{stroke-dasharray:24;animation:check .4s .1s ease-out both}
.star{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted2);background:rgba(0,0,0,.55);z-index:3;cursor:pointer;opacity:0;transition:all .2s var(--ease)}
.card:hover .star,.star.on{opacity:1}
.star:hover{color:#fff;transform:scale(1.15)}
.star.on{color:#fff}.star.on svg{fill:#fff}
.styles{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.styles .chip{padding:2px 8px;font-size:10px}
.card::after,.fcard::after,.hcard::after,.tile::after,.stat::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.10),transparent 60%)}
.card:hover::after,.fcard:hover::after,.hcard:hover::after,.tile:hover::after,.stat:hover::after{opacity:1}
.empty{color:var(--muted);padding:40px 0;text-align:center;font-weight:600}

.hero-banner{position:relative;border:1px solid var(--border2);border-radius:16px;padding:22px 24px;margin-bottom:12px;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,#1d1d1d 0%,#0d0d0d 55%,#080808 100%);animation:fadeIn .5s var(--ease) both}
.hero-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:200% 100%;animation:drift 7s linear infinite;pointer-events:none}
.hero-banner::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 70%)}
.hero-banner h1{font-size:24px;letter-spacing:.4px}
.hero-banner p{color:var(--text2);margin:6px 0 14px;max-width:540px;font-size:12.5px}
.hero-banner>.row>svg{animation:floaty 4s ease-in-out infinite}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fcard{position:relative;border:1px solid var(--border2);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--panel);transition:transform .25s var(--ease),border-color .2s,box-shadow .25s;animation:cardIn .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms);will-change:transform}
.fcard:hover{border-color:var(--border4);box-shadow:0 14px 30px rgba(0,0,0,.55)}
.fcard .ph{aspect-ratio:16/10;background:radial-gradient(circle at 50% 35%,#1b1b1b,#0c0c0c)}
.fcard .ph img{padding:10px;transition:opacity .35s,transform .5s var(--ease)}
.fcard:hover .ph img{transform:scale(1.1)}
.card:hover .ph.loaded img{transform:scale(1.1)}
.hcard:hover .ph.loaded img{transform:scale(1.08)}
.fcard .cap{padding:8px 11px 10px;border-top:1px solid var(--border)}
.fcard .cap b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .cap span{font-size:10px;color:var(--muted2);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.fcard .rar{position:absolute;left:8px;top:8px;font-size:9px;font-weight:900;letter-spacing:.6px;padding:2px 7px;border-radius:5px;background:#fff;color:#000;z-index:2}

.panel{background:var(--panel);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:12px;animation:fadeIn .35s var(--ease) both}
.panel h3{font-size:13px;font-weight:800;margin-bottom:10px}
.two{column-count:2;column-gap:12px}
.two>.panel{break-inside:avoid;margin-bottom:12px;display:block}
@media (max-width:1000px){.two{column-count:1}}
.panel .frow select,.panel .frow .search{width:200px;max-width:200px}
.panel .frow>div:first-child{min-width:0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:0}
.frow .l{font-weight:600;font-size:12px}.frow .d{color:var(--muted2);font-size:11px;margin-top:2px;max-width:480px}
.sw{width:38px;height:22px;border-radius:11px;background:var(--border3);position:relative;cursor:pointer;flex-shrink:0;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s var(--ease),background .2s}
.sw.on{background:#fff}.sw.on::after{transform:translateX(16px);background:#000}
.swatch{width:30px;height:30px;border-radius:9px;border:2px solid var(--border3);cursor:pointer;transition:all .2s var(--ease)}

/* ===== CHAMELEON — refined loading ===== */

body {
    font-family: 'Manrope', 'Segoe UI', sans-serif;
}

/* Брендинг приложения */
.title,
.lname {
    font-family: 'Unbounded', 'Manrope', sans-serif;
}

/* Компактный экран загрузки */
#loading {
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(255, 255, 255, .035),
            transparent 45%
        ),
        #080808;
    justify-content: center;
    padding: 0 20px 16px;
    gap: 0;
    transition: opacity .45s ease;
}

/* Анимации появления */
@keyframes markEnter {
    0% {
        opacity: 0;
        transform: translateY(12px) scale(.88);
    }
    70% {
        opacity: 1;
        transform: translateY(-2px) scale(1.025);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes glyphEnter {
    from {
        opacity: 0;
        transform: scale(.82);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes nameEnter {
    from {
        opacity: 0;
        transform: translateY(8px);
        letter-spacing: 5px;
    }
    to {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: 2px;
    }
}

@keyframes progressEnter {
    from {
        opacity: 0;
        transform: translateY(7px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes progressShine {
    from { transform: translateX(-150%); }
    to   { transform: translateX(350%); }
}

/* Минималистичный знак */
.lshield {
    position: relative;
    width: 60px;
    height: 60px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    background: #111;
    border: 1px solid #272727;
    box-shadow:
        0 8px 28px rgba(0, 0, 0, .32),
        inset 0 1px 0 rgba(255, 255, 255, .035);
    opacity: 0;
    animation: markEnter .68s cubic-bezier(.2, .8, .2, 1) .05s forwards;
}

.lshield::before,
.lshield::after {
    display: none !important;
    content: none !important;
}

.lshield svg {
    width: 30px;
    height: 30px;
    fill: none;
    stroke: #f2f2f2;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: none;
    opacity: 0;
    animation: glyphEnter .42s ease .22s forwards;
}

.lshield svg path,
.lshield svg path + path {
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    animation: none;
}

/* Название — плотное и выразительное */
.lname {
    margin-top: 19px;
    font-size: 18px;
    line-height: 1.5;
    font-weight: 700;
    letter-spacing: 2px;
    color: #f4f4f4;
    background: none;
    -webkit-background-clip: initial;
    background-clip: initial;
    -webkit-text-fill-color: #f4f4f4;
    opacity: 0;
    animation: nameEnter .55s cubic-bezier(.22, 1, .36, 1) .22s both;
}

/* Полоса загрузки */
.lbarw {
    width: min(250px, 76vw);
    margin-top: 23px;
    opacity: 0;
    animation: progressEnter .45s ease .38s both;
}

.lbar {
    position: relative;
    height: 3px;
    background: #202020;
    border-radius: 3px;
    overflow: hidden;
}

.lbar i {
    display: block;
    position: relative;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, #999, #fff);
    box-shadow: none;
    transition: width .35s cubic-bezier(.22, 1, .36, 1);
    overflow: hidden;
}

/* Тонкий блик внутри прогресса */
.lbar i::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 30%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .85),
        transparent
    );
    animation: progressShine 1.3s ease-in-out .5s infinite;
}

.lrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    color: #707070;
}

.lrow #lpct {
    font-family: 'JetBrains Mono', monospace;
    color: #ededed;
    font-size: 10px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

/* Состояние ошибки */
#loading.fail .lrow {
    color: #ff4757;
}

/* Адаптация к небольшому окну */
@media (max-width: 480px) {
    .lshield {
        width: 54px;
        height: 54px;
        border-radius: 14px;
    }

    .lshield svg {
        width: 27px;

    }

    .lbarw {
        margin-top: 20px;
    }
}

@media (prefers-reduced-motion: reduce) {
    /* Отключаем плавный скролл на всем сайте */
    html {
        scroll-behavior: auto !important;
    }

    /* Применяем ко всем элементам, их ::before и ::after */
    *,
    *::before,
    *::after {
        /* Длительность 0.01ms делает анимацию мгновенной для глаза, */
        /* но сохраняет срабатывание JS-событий (animationend / transitionend) */
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
        
        /* Заставляем анимацию проигрываться только 1 раз, чтобы не вешать браузер */
        animation-iteration-count: 1 !important;
    }
}

  #loading *, #loading *::before, #loading *::after,
  .card, .hcard, .fcard, .btn {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    transition-duration: .01ms !important;
  }
}

.hero-banner h1 {
    font-family: 'Unbounded', sans-serif;
}

/* ===== CHAMELEON — premium sidebar tooltips ===== */

.nav .tip {
    position: absolute;
    left: calc(100% + 13px);
    top: 50%;
    z-index: 100;

    display: flex;
    align-items: center;

    min-height: 36px;
    padding: 0 14px 0 17px;

    background: linear-gradient(180deg, #1c1c1c 0%, #101010 100%);
    border: 1px solid #353535;
    border-radius: 10px;

    color: #f4f4f4;
    font-family: 'Manrope', 'Segoe UI', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .25px;
    white-space: nowrap;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transform: translate(8px, -50%) scale(.96);
    transform-origin: left center;

    box-shadow:
        0 10px 28px rgba(0, 0, 0, .5),
        inset 0 1px 0 rgba(255, 255, 255, .035);

    transition:
        opacity .18s ease,
        transform .26s cubic-bezier(.22, 1, .36, 1),
        visibility 0s linear .26s;
}

/* Стрелка, направленная на иконку */
.nav .tip::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 50%;

    width: 8px;
    height: 8px;

    background: #171717;
    border-left: 1px solid #353535;
    border-bottom: 1px solid #353535;

    transform: translateY(-50%) rotate(45deg);
    border-radius: 1px;
}

/* Тонкий фирменный акцент */
.nav .tip::after {
    content: "";
    position: absolute;
    left: 0;
    top: 9px;
    bottom: 9px;

    width: 2px;
    border-radius: 2px;
    background: linear-gradient(180deg, #fff, #777);
    box-shadow: 0 0 8px rgba(255, 255, 255, .15);
}

/* Появление при наведении */
.nav:hover .tip,
.nav:focus-visible .tip {
    opacity: 1;
    visibility: visible;

    transform: translate(0, -50%) scale(1);

    transition:
        opacity .18s ease,
        transform .26s cubic-bezier(.22, 1, .36, 1),
        visibility 0s;
}

/* Подсказка активной вкладки */
.nav.on .tip {
    border-color: #454545;
}

/* Немного выразительнее при наведении на активную иконку */
.nav.on:hover .tip {
    background: linear-gradient(180deg, #242424 0%, #141414 100%);
    border-color: #555;
}

/* Поддержка пользователей, отключивших анимации */
@media (prefers-reduced-motion: reduce) {
    .nav .tip {
        transition: none !important;
    }
}
/* ---- Улучшенный тултип сайдбара ---- */
.nav .tip {
    position: absolute;
    left: 54px;
    top: 50%;
    transform: translate(-10px, -50%) scale(0.94);
    background: #161616;
    color: var(--text, #f5f5f5);
    border: 1px solid var(--border3, #2c2c2c);
    padding: 6px 12px;
    border-radius: 9px;
    font-family: 'Manrope', 'Segoe UI', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s var(--ease, cubic-bezier(.22,1,.36,1)), transform 0.22s var(--ease, cubic-bezier(.22,1,.36,1));
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.nav .tip::before {
    content: "";
    position: absolute;
    left: -4px;
    top: 50%;
    width: 8px;
    height: 8px;
    background: #161616;
    border-left: 1px solid var(--border3, #2c2c2c);
    border-bottom: 1px solid var(--border3, #2c2c2c);
    transform: translateY(-50%) rotate(45deg);
    border-radius: 2px;
}

.nav:hover .tip {
    opacity: 1;
    transform: translate(0, -50%) scale(1);
}

function lazy(root){

}
function showIcon(img,b64){img.onload=()=>{img.parentNode.classList.add('loaded')};img.src='data:image/png;base64,'+b64}
function fetchIcon(img){
  const k=img.getAttribute('data-ik');
  if(S.icons[k]){showIcon(img,S.icons[k]);return}
  const p=img.getAttribute('data-kind')==='hero'?cham.get_hero_icon(img.getAttribute('data-n'),128):cham.get_item_icon(img.getAttribute('data-n'),img.getAttribute('data-path')||'',128);

}

  }

}
/* fills a grid in small frames so a 600-card tab never blocks the UI */
function fillGrid(el,items,ctx){
  const tok=S.rt;let i=0;const CH=36;
  (function step(){
    if(tok!==S.rt||!el.isConnected)return;
    const end=Math.min(items.length,i+CH);let h='';
    for(;i<end;i++)h+=card(items[i],ctx,i);
    el.insertAdjacentHTML('beforeend',h);lazy(el);
    if(i<items.length)raf(step);
  })();
}
function prepare(list,q){
  const ql=(q||'').toLowerCase();
  let out=list.filter(x=>(!ql||nameOf(x).toLowerCase().indexOf(ql)>=0)&&(!S.selOnly||isSel(x.name)));
  const az=(a,b)=>nameOf(a).localeCompare(nameOf(b));
  const rk=x=>{const r=String(x.rarity||'').replace('rarity_','').toLowerCase();return x.is_arcana?7:(RANK[r]||0)};
  if(S.sort==='rarity')out.sort((a,b)=>rk(b)-rk(a)||az(a,b));
  else if(S.sort==='sel')out.sort((a,b)=>(isSel(b.name)-isSel(a.name))||az(a,b));
  else out.sort(az);
  return out;
}

function renderHero(o){

function drawHeroBody(){
  const c=S.catalog,body=$('hbody');if(!c||!body)return;S.rt++;body.innerHTML='';
  const ctx='hero:'+S.cur;let any=false;

    c.slots.forEach((g,gi)=>{
      if(S.slot!=='all'&&S.slot!==g.slot)return;
      const list=prepare(g.items,S.hs);if(!list.length)return;any=true;const k=slotCount(g.slot);
      body.insertAdjacentHTML('beforeend','<div class="slothead" data-slot="'+esc(g.slot)+'">'+esc(g.title)+(k?'<span class="ct">'+esc(t('appliedSlot',{n:k}))+'</span>':'')+'</div><div class="igrid d-'+S.dens+'" id="gs'+gi+'"></div>');
      fillGrid($('gs'+gi),list,ctx);
    });
  }else{
    const src=c[S.group]||[],list=prepare(src,S.hs);

  }

}

      +fr('icCast','icCastD',sw('iccast',c.icon_fix_cast!==false))
      +'<div class="frow"><div><div class="l">'+esc(t('icStats'))+'</div><div class="d" id="icst">'+(ist.from_vpk||0)+' / '+(ist.from_cdn||0)+' / '+(ist.from_disk||0)+' / '+(ist.missing||0)+'</div></div><button class="btn" data-act="icclear">'+esc(t('icClear'))+'</button></div></div>'
    +'<div class="panel"><h3>'+esc(t('game'))+'</h3><div class="frow"><div><div class="l">'+esc(t('dotaFolder'))+'</div><div class="d" id="dp">'+esc(c.dota_path||t('notSet'))+'</div></div><button class="btn" data-act="dpath">'+ic('i-folder','sm')+esc(t('browse'))+'</button></div>'
      +'<div class="frow"><div class="l">'+esc(t('launchParams'))+'</div><input class="search" id="lp" value="'+esc(c.launch_parameters||'')+'" data-inp="lp"></div></div>'
    +'<div class="panel"><h3>'+esc(t('behaviour'))+'</h3>'
      +fr('restoreExit','restoreExitD',sw('restore',c.auto_restore_on_exit!==false))+fr('packRes','packResD',sw('pack',c.pack_resources!==false))
      +fr('packMode','packModeD',sel3('packmode',c.pack_mode==='full'?'full':'minimal',[['minimal','Minimal'],['full','Full']]))
      +fr('sigTitle','sigD',sw('sig',c.patch_signatures!==false))
      +fr('swap','swapD',sel3('swap',c.particle_swap||'hero',[['hero','swapHero'],['all','swapAll'],['off','swapOff']]))
      +fr('defMode','defModeD',sel3('defmode',c.default_mode||'auto',[['auto','defAuto'],['replace','defReplace'],['create','defCreate']]))
      +fr('effMode','effModeD',sel3('effmode',c.effect_mode||'slot',[['slot','effSlot'],['hero','effHero'],['both','effBoth']]))
      +fr('heroModel','heroModelD',sw('hmodel',c.patch_hero_model!==false))+'</div>'
    +'<div class="panel"><h3>'+esc(t('report'))+'</h3>'+(rh||'<div class="d" style="color:var(--muted2)">'+esc(t('noReport'))+'</div>')+'</div>'
    +'<div class="panel"><h3>'+esc(t('maint'))+'</h3><div class="frow"><div><div class="l">'+esc(t('cache'))+'</div><div class="d">'+esc(cs.formatted||'')+'</div></div><div class="row"><button class="btn" data-act="cclear">'+esc(t('clearCache'))+'</button><button class="btn" data-act="rebuild">'+esc(t('rebuild'))+'</button><button class="btn dng" data-act="cleanmod">'+esc(t('removeMod'))+'</button></div></div></div></div>';
  });
}

/* ================= apply progress card ================= */
const STAGES=['scan','build','resources','extras','write','register'],STN={scan:'stScan',build:'stBuild',resources:'stResources',extras:'stExtras',write:'stWrite',register:'stRegister'};
let povTimer=0;
function povSteps(cur,done){
  const ci=STAGES.indexOf(cur);
  $('povs').innerHTML=STAGES.map((x,i)=>'<div class="st'+(done||i<ci?' done':(i===ci?' act':''))+'"><i></i>'+esc(t(STN[x]))+'</div>').join('');
}
function povSet(pct){
  const p=Math.max(0,Math.min(100,pct));
  $('povp').textContent=Math.round(p)+'%';$('povb').style.width=Math.max(2,p)+'%';
  $('povring').style.strokeDashoffset=String(201.06*(1-p/100));
  $('pfill').style.width=Math.max(2,p)+'%';
}
function onProgress(pct,stage,detail){
  const o=$('pov');
  if(!o.classList.contains('on')){S.t0=Date.now();o.classList.remove('done','err');o.classList.add('on');clearInterval(povTimer);
    povTimer=setInterval(()=>{$('povtm').textContent=t('elapsed')+' '+((Date.now()-S.t0)/1000).toFixed(1)+'s'},200)}
  const stepN=Math.max(0,STAGES.indexOf(stage))+1;$('povt').textContent=t('building')+' · '+t('stepOf',{n:stepN,m:STAGES.length});$('povd').textContent=detail||t('working');$('ptxt').textContent=detail||t('working');
  povSteps(stage,false);povSet(pct);
}
function povFinish(ok){
  const o=$('pov');clearInterval(povTimer);o.classList.add('done');if(!ok)o.classList.add('err');
  $('povt').textContent=ok?t('buildDone'):t('buildFail');
  if(ok){povSet(100);povSteps('register',true)}
  $('povtm').textContent=t('elapsed')+' '+((Date.now()-S.t0)/1000).toFixed(1)+'s';
  setTimeout(()=>o.classList.remove('on'),ok?1900:4200);
}
function progress(msg){
  $('ptxt').textContent=msg;
  if(/^(Error|Failed)/.test(msg)){$('povd').textContent=msg}
}

/* ================= events (one delegated handler) ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(b)ripple(e,b);
  const nav=e.target.closest('[data-go]');if(nav){S.cur=null;S.catalog=null;go(nav.getAttribute('data-go'));return}
  const w=e.target.closest('[data-win]');if(w){const v=w.getAttribute('data-win');v==='min'?cham.minimize_window():v==='max'?cham.toggle_maximize_window():cham.close_window();return}
  const tt=e.target.closest('[data-act]');if(!tt)return;
  const a=tt.getAttribute('data-act'),v=tt.getAttribute('data-v'),n=tt.getAttribute('data-n');
  if(a==='style'){e.stopPropagation();pickStyle(n,parseInt(tt.getAttribute('data-s'),10),tt.getAttribute('data-ctx'));return}
  switch(a){
    case 'pick':pick(n,tt.getAttribute('data-ctx'));break;
    case 'hero':openHero(n);break;
    case 'gohero':S.cur=null;go('heroes');break;
    case 'gocat':go('extras');break;
    case 'shuffle':S.featured=[];renderHome();break;
    case 'back':S.cur=null;S.catalog=null;S.page='extras';go('heroes');break;
    case 'group':S.group=v;S.slot='all';S.hs='';renderHero({still:true});$('p-heroes').scrollTop=0;break;
    case 'slot':S.slot=v;{const sc=$('slotchips');if(sc)sc.innerHTML=slotChips();}drawHeroBody();break;
    case 'grp':S.grp=v;S.eq='';S.cat='';renderExtras({still:true});break;
    case 'cat':S.cat=v;S.eq='';renderExtras({still:true});break;
    case 'sort':break;
    case 'dens':setDens(v);break;
    case 'selonly':S.selOnly=!S.selOnly;$('selOnlyChip').classList.toggle('on',S.selOnly);if(S.page==='heroes')drawHeroBody();else drawCat();break;
    case 'fav':e.stopPropagation();cham.toggle_favorite(n).then(on=>{S.favs[n]=on?1:0;document.querySelectorAll('.star[data-n="'+n+'"]').forEach(x=>x.classList.toggle('on',!!on));if(S.page==='favs')setTimeout(renderFavs,60)});break;
    case 'lpsel':cham.select_launch_preset(n);setTimeout(renderLaunch,80);break;
    case 'lpdel':e.stopPropagation();cham.delete_launch_preset(n);setTimeout(renderLaunch,80);break;
    case 'lpflag':{const inp=$('lpp'),parts=inp.value.split(/\s+/).filter(Boolean),ix=parts.indexOf(v);if(ix>=0)parts.splice(ix,1);else parts.push(v);inp.value=parts.join(' ');tt.classList.toggle('on')}break;
    case 'lpsave':{const nn=$('lpn').value.trim();if(nn){cham.save_launch_preset(nn,$('lpp').value);setTimeout(renderLaunch,120)}}break;
    case 'river':cham.set_river_color(v);setTimeout(()=>refresh(renderWorld),150);break;
    case 'bgbrowse':cham.browse_background();setTimeout(()=>refresh(renderWorld),1400);break;
    case 'bgreset':cham.set_background('');setTimeout(()=>refresh(renderWorld),150);break;
    case 'bginstall':cham.install_background_layout().then(()=>renderWorld());break;
    case 'rm':cham.remove_override(tt.getAttribute('data-k'));setTimeout(afterChange,80);break;
    case 'clearall':cham.clear_all_overrides();setTimeout(afterChange,100);break;
    case 'psave':{const pn=$('pn').value.trim();if(pn){cham.save_preset(pn);setTimeout(renderPresets,200)}}break;
    case 'pload':cham.load_preset(n);setTimeout(()=>refresh(()=>{toast(t('presetLoaded'),'ok');renderPresets()}),450);break;
    case 'pdel':cham.delete_preset(n);setTimeout(renderPresets,200);break;
    case 'restore':cham.restore_all();setTimeout(()=>refresh(()=>{go(S.page,{still:true});modPill()}),300);break;
    case 'launch':cham.launch_dota();break;
    case 'apply':$('applyBtn').disabled=true;onProgress(2,'scan',t('working'));cham.apply_all();break;
    case 'dpath':cham.browse_dota_path().then(p=>{if(p)$('dp').textContent=p});break;
    case 'cclear':cham.clear_cache();setTimeout(renderSettings,300);break;
    case 'icclear':cham.clear_icon_cache().then(()=>{resetIcons();toast(t('icCleared'),'ok');renderSettings()});break;
    case 'rebuild':cham.rebuild_database();toast(t('rebuildToast'),'ok');break;
    case 'cleanmod':cham.cleanup_mod();setTimeout(()=>{refresh();modPill()},300);break;
    case 'sw':{
      tt.classList.toggle('on');const on=tt.classList.contains('on'),id=tt.getAttribute('data-id');
      if(id==='restore')cham.set_auto_restore(on);
      else if(id==='pack')cham.save_hud_settings(1,1,on,true);
      else if(id==='hmodel')cham.set_option('patch_hero_model',on?'true':'false');
      else if(id==='sig')cham.set_option('patch_signatures',on?'true':'false');
      else if(id==='iccast'){cham.set_option('icon_fix_cast',on?'true':'false');resetIcons()}
    }break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.getAttribute&&el.getAttribute('data-act');if(!a)return;
  if(a==='sort'){S.sort=el.value;if(S.page==='heroes')drawHeroBody();else drawCat()}
  else if(a==='packmode')cham.set_option('pack_mode',el.value);
  else if(a==='swap')cham.set_option('particle_swap',el.value);
  else if(a==='defmode')cham.set_option('default_mode',el.value);
  else if(a==='effmode')cham.set_option('effect_mode',el.value);
  else if(a==='bgmethod'){cham.set_option('bg_method',el.value);$('bglayrow').style.display=el.value==='layout'?'flex':'none'}
  else if(a==='icfield'){cham.set_option('icon_field',el.value);resetIcons();S.catItems=[];S.catalog=null;S.featured=[];toast(t('icCleared'),'ok')}
  else if(a==='icsource'){cham.set_option('icon_source',el.value);resetIcons()}
  else if(a==='uilang'){LANG=el.value;cham.set_option('language',LANG);buildNav();retitle();go('settings',{still:true})}
});
document.addEventListener('input',e=>{
  const el=e.target,k=el.getAttribute&&el.getAttribute('data-inp');if(!k)return;
  if(k==='hq'){S.hq=el.value;clearTimeout(S._ht);S._ht=setTimeout(drawHeroGrid,80)}
  else if(k==='eq'){S.eq=el.value;clearTimeout(S._et);S._et=setTimeout(drawCat,110)}
  else if(k==='hs'){S.hs=el.value;clearTimeout(S._hst);S._hst=setTimeout(drawHeroBody,110)}
  else if(k==='lp')cham.set_launch_params(el.value);
});
document.addEventListener('mousedown',e=>{const r=e.target.closest('[data-rs]');if(r){cham.start_resize(r.getAttribute('data-rs'));return}if(e.target.closest('#drag')&&e.button===0)cham.start_move()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.page==='heroes'&&S.cur){S.cur=null;S.catalog=null;go('heroes',{still:true})}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){const q=$('hs')||$('hq')||$('cq');if(q){e.preventDefault();q.focus()}}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!$('applyBtn').disabled){$('applyBtn').click()}
});
/* spotlight + tilt (rAF-throttled) */
let _mm=0;
document.addEventListener('mousemove',e=>{
  if(_mm)return;const tg=e.target;
  _mm=raf(()=>{_mm=0;const c=tg.closest&&tg.closest('.card,.fcard,.hcard,.tile,.stat');if(!c)return;
    const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
    if(c.classList.contains('fcard')){const rx=((y/r.height)-.5)*-7,ry=((x/r.width)-.5)*9;c.style.transform='perspective(700px) rotateX('+rx+'deg) rotateY('+ry+'deg) translateY(-4px)'}});
});
document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('.fcard');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});

/* ================= status pill ================= */
function modPill(){cham.get_status().then(s=>{const st=J(s)||{};const u=$('upd');if(u){u.textContent=t('staleMsg');u.classList.toggle('on',!!st.stale)}
  $('modPill').classList.toggle('on',!!st.vpk);$('modTxt').textContent=st.vpk?t('modOn'):t('modOff');if(st.items)S.itemTotal=st.items})}

/* ================= background particles ================= */
(function(){
  const cv=$('particles'),cx=cv.getContext('2d'),P=[];let W=0,H=0;
  const size=()=>{W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight};size();window.addEventListener('resize',size);
  for(let i=0;i<30;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.4,vx:(Math.random()-.5)*.00012,vy:-Math.random()*.00022-.00005,a:Math.random()*.25+.05});
  (function tick(){
    if(!document.hidden&&S.ready){cx.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-.02){p.y=1.02;p.x=Math.random()}cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,6.283);cx.fillStyle='rgba(255,255,255,'+p.a+')';cx.fill()})}
    raf(tick);
  })();
})();

/* ================= loading screen ================= */
const L={pct:0,target:6,done:false,stopped:false};
function buildLoading(){
  $('lstep').textContent=t('ld_start');
  (function frame(){
    if(L.stopped)return;
    const gap=L.target-L.pct;L.pct+=gap>0?Math.max(.05,gap*.06):0;
    if(!L.done&&L.target<90)L.target=Math.min(90,L.target+.012);
    const p=Math.min(100,L.pct);$('lbar').style.width=p+'%';$('lpct').textContent=Math.round(p)+'%';
    raf(frame);
  })();
}
function loadStatus(msg){
  const m=String(msg),set=(p,k)=>{if(p>L.target)L.target=p;$('lstep').textContent=t(k)};
  if(/hero|slot/i.test(m))set(72,'ld_heroes');
  else if(/categor/i.test(m))set(86,'ld_cats');
  else if(/items_game|Parsing items|items/i.test(m))set(48,'ld_items');
  else if(/locali|language|token/i.test(m))set(28,'ld_loc');
  else if(/saving|cache/i.test(m))set(94,'ld_cache');
  else if(/vpk|open|load|read|extract/i.test(m))set(14,'ld_files');
}
function loadFinish(ok){
  const el=$('loading');
  if(!ok){el.classList.add('fail');$('lstep').textContent=t('ld_fail');return}
  L.target=100;$('lstep').textContent=t('ld_done');
  const wait=()=>{if(L.pct>=99){L.done=true;el.classList.add('out');setTimeout(()=>{L.stopped=true;el.style.display='none'},700)}else raf(wait)};wait();
}

/* ================= boot ================= */
function onReady(){
  if(S.ready)return;S.ready=true;
  cham.get_config().then(cs=>{
    const c=J(cs)||{};if(c.language==='ru'||c.language==='en')LANG=c.language;S.cfg=c;S.dens=c.ui_density||'m';
    buildNav();retitle();$('ptxt').textContent=t('ready');
    return cham.get_heroes();
  }).then(s=>{S.heroes=J(s)||[];refresh(()=>{go('home');modPill();loadFinish(true)})});
}
new QWebChannel(qt.webChannelTransport,ch=>{
  cham=ch.objects.chameleon;buildNav();applyStatic();buildLoading();
  cham.statusChanged.connect(m=>{
    progress(m);
    if(/^(Error|Failed)/.test(m))toast(m,'err');
    else if(/^(Done|Selected|Settings saved|Restored|Launching|Style)/.test(m))toast(m,'ok');
    if(!S.ready)loadStatus(m);
  });
  cham.applyResult.connect(ok=>{$('applyBtn').disabled=false;povFinish(ok);toast(ok?t('applied'):t('applyFail'),ok?'ok':'err');modPill();if(S.page==='settings')renderSettings()});
  cham.dbLoaded.connect(ok=>{if(ok){L.target=Math.max(L.target,96);setTimeout(onReady,180)}else{loadFinish(false)}});
  cham.iconReady.connect(onIconReady);
  cham.progressChanged.connect(onProgress);
  $('ver').textContent='v15.3';
  (function poll(){cham.get_status().then(s=>{const st=J(s)||{};if(st.status==='ready')onReady();else setTimeout(poll,500)})})();
});
